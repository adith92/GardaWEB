[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garda-ai-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.12,<1", "pydantic>=2.8,<3", "cryptography>=43,<48", "opencv-python-headless>=4.10,<5", "numpy>=2,<3"]

[project.scripts]
garda-vision = "garda_vision.api:run"

[tool.setuptools.packages.find]
include = ["garda_vision*"]
