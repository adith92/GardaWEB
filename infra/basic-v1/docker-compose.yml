name: garda-basic-v1

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-garda}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../services/garda-api/db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_API_PASSWORD:?set MEDIAMTX_API_PASSWORD}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ${GARDA_RECORDINGS_DIR:-./data/recordings}:/recordings
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:9996:9996"
    networks: [backend]

  garda-api:
    build:
      context: ../..
      dockerfile: infra/basic-v1/Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: "8088"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-garda}"
      GARDA_ADMIN_TOKEN: ${GARDA_ADMIN_TOKEN:?set GARDA_ADMIN_TOKEN}
      GARDA_CAMERA_KEY_HEX: ${GARDA_CAMERA_KEY_HEX:?set GARDA_CAMERA_KEY_HEX}
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?set MEDIAMTX_API_PASSWORD}
      MEDIAMTX_API_URL: "http://mediamtx:9997"
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "127.0.0.1:8088:8088"
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
