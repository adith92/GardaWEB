function screenMarkup(id,theme,device,tab='Live',skeleton=false){
 const t=id-1;
 let body;
 if(tab==='Live')body=bodyTemplates[t]();
 else if(tab==='Cameras')body=`${top('Camera Registry','DISCOVERY / LAN')}<div class="alerts-card"><strong style="font-size:13px">04 devices online</strong><p class="minor" style="margin-bottom:3px">Active LAN 192.168.18.0/24 · ONVIF / RTSP</p>${btn('⌁ Scan LAN','scan','primary wide')}</div>${sources()}<div class="action-row">${btn('+ Add camera','add','wide')}${btn('◉ Quick Connect','scan','primary wide')}</div>`;
 else if(tab==='Events')body=`${top('Security Events','RECENT ACTIVITY')}${feed('parking','GARAGE • DEMO','short-feed')}<div class="list-card" style="margin-top:10px">${['09:41 · All cameras online','09:16 · Garage activity recorded','07:53 · Front entrance motion','06:20 · Camera stream resumed'].map(x=>`<div class="status-line"><span>● ${x}</span><b>↗</b></div>`).join('')}</div><div class="action-row">${btn('▶ Review events','none','primary wide')}</div>`;
 else body=`${top('Appearance','DEVICE SETTINGS')}<div class="list-card"><div class="status-line"><span>App name</span><b>GARDA CCTV FOLD edition</b></div><div class="status-line"><span>Rendering</span><b>Native Compose planned</b></div><div class="status-line"><span>Camera control</span><b>LAN-only</b></div><div class="status-line"><span>Theme</span><b>${theme==='dark'?'Black / Red':'White / Red'}</b></div><div class="status-line"><span>Safe system navigation</span><b>Reserved</b></div></div><div class="alerts-card"><strong style="font-size:12px">Privacy first</strong><p class="minor">All imagery is concept illustration. No actual camera stream is shown.</p></div>`;
 return `<div class="screen ${theme} template-${id} ${skeleton?'skeleton':''}" data-concept="${id}"><div class="screen-bar"><span>9:41</span><span class="camera-dot"></span><span>▴▴ ▰ 100%</span></div><div class="screen-core">${header(id===10?'TACTICAL FOLD EDITION':'FOLD EDITION')}<div class="screen-scroll ${id===3||id===10?'immersive':''}">${body}</div></div>${nav()}<div class="android-system" aria-label="System navigation buttons reserved"><span class="sys-back"></span><span class="sys-home"></span><span class="sys-recents"></span></div></div>`;
}
function renderStudio(){
const c=concepts[state.concept];
root.innerHTML=`<main class="studio"><div class="studio-top"><div class="studio-brand"><div class="logo"><span>G</span></div><div><div class="studio-eyebrow">Design exploration / 2026</div><div class="studio-title">GARDA CCTV <span style="color:#f3495e">FOLD</span> edition</div><small>10 native-first directions • foldable responsive experience</small></div></div><div class="studio-chip">CONCEPT STUDY · NOT AN APK BUILD</div></div><div class="studio-rule"></div><div class="studio-controls"><div class="horizontal"><span class="studio-label">Palette</span><div class="selector-group"><button class="selector ${state.theme==='light'?'active':''}" data-theme="light">☀ White / Red</button><button class="selector ${state.theme==='dark'?'active':''}" data-theme="dark">☾ Black / Red</button></div></div><div class="horizontal"><span class="studio-label">Display</span><div class="selector-group"><button class="selector ${state.device==='closed'?'active':''}" data-device="closed">▯ Fold closed</button><button class="selector ${state.device==='open'?'active':''}" data-device="open">▣ Fold open</button></div></div><div class="horizontal"><button class="selector" data-action="scan">⌁ Simulate LAN load</button><button class="selector" data-action="next">Next concept →</button></div></div><div class="workspace"><aside class="concept-gallery">${concepts.map((item,i)=>`<button data-concept="${i+1}" class="concept-card ${i===state.concept?'selected':''}"><div class="concept-id"><span>${String(i+1).padStart(2,'0')}</span><span>↗</span></div><div class="mini-vision type-${i+1}"><div class="mini-head"></div><div class="mini-blocks"><div></div><div></div><div></div><div></div></div></div><div class="concept-title">${item.name}</div><div class="concept-caption">${item.desc}</div></button>`).join('')}</aside><section class="preview-panel"><div class="preview-top"><span class="preview-name">${c.name}</span><span class="preview-index">${String(state.concept+1).padStart(2,'0')} / 10</span></div><div class="device-outer"><div class="hardware ${state.device}">${screenMarkup(state.concept+1,state.theme,state.device,state.tab,state.loading)}</div></div></section><aside class="design-details"><div class="details-id">${String(state.concept+1).padStart(2,'0')}</div><div class="details-name">${c.name}</div><div class="tag-row">${c.tags.map(t=>`<span class="detail-tag">${t}</span>`).join('')}</div><p class="details-text">${c.detail}</p><div class="why"><div class="why-title">Interaction notes</div><p class="why-line">${c.why}</p><p class="why-line">• Bottom app navigation stays above Android's 3-button system bar.<br/>• Camera operations show visual feedback immediately.<br/>• Slow discovery is simulated with skeletons; future native implementation uses IO dispatcher.<br/>• Optional Three.js orb in concept 10 uses browser-only WebGL.</p><div class="why-title" style="margin-top:20px">Test the layout</div><p class="why-line">Change device mode and palette. Try the controls and tabs inside the frame. Concept 01 or 08 is best suited for an initial native build.</p></div></aside></div><div class="studio-footer"><span>GARDA FOLD DESIGN SYSTEM · 10 CONCEPTS × 2 THEMES · 3-BUTTON NAVIGATION SAFE AREA</span><span><span class="shortcut">←</span> <span class="shortcut">→</span> Switch concepts · <span class="shortcut">T</span> Toggle theme</span></div></main>`;
 bind();initThreeIfNeeded();
}
function renderContact(){
let q=new URLSearchParams(location.search),theme=q.get('theme')==='light'?'light':'dark';state.tab='Live';
root.innerHTML=`<main class="contact-page theme-${theme}"><div class="contact-head"><div><div class="studio-eyebrow">GARDA CCTV / FOLD EDITION</div><h1>10 UI Directions · ${theme==='light'?'White + Red':'Black + Red'}</h1></div><span>CONCEPT BOARD / NOV 2026</span></div><div class="contact-grid">${concepts.map((c,i)=>`<div class="contact-tile"><div class="contact-title"><span>${String(i+1).padStart(2,'0')}. ${c.name}</span><span style="color:#ed4157">●</span></div><div class="contact-screen-wrap"><div class="contact-screen-inner">${screenMarkup(i+1,theme,'closed','Live')}</div></div><div class="contact-desc">${c.desc}</div></div>`).join('')}</div></main>`;
 requestAnimationFrame(sizeContacts);
}
function sizeContacts(){document.querySelectorAll('.contact-screen-wrap').forEach(n=>{let s=n.clientWidth/376;n.firstElementChild.style.transform=`scale(${s})`})}
let messageTimer;
function toast(message){let screen=document.querySelector('.hardware .screen');if(!screen)return;screen.querySelector('.screen-toast')?.remove();let box=document.createElement('div');box.className='screen-toast';box.textContent=message;screen.append(box);clearTimeout(messageTimer);messageTimer=setTimeout(()=>box.remove(),2150)}
function simulateScan(){if(state.loading)return;state.loading=true;renderStudio(); // immediate visual update before simulated IO
 setTimeout(()=>{state.loading=false;state.tab='Cameras';renderStudio();toast('Demo scan complete · 4 cameras listed')},1300)}
function bind(){document.querySelectorAll('[data-concept]').forEach(e=>{if(e.classList.contains('concept-card'))e.onclick=()=>{state.concept=Number(e.dataset.concept)-1;state.tab='Live';renderStudio()}});
 document.querySelectorAll('[data-theme]').forEach(e=>e.onclick=()=>{state.theme=e.dataset.theme;renderStudio()});
 document.querySelectorAll('[data-device]').forEach(e=>e.onclick=()=>{state.device=e.dataset.device;renderStudio()});
 document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;renderStudio()});
 document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>{let a=e.dataset.action;if(a==='scan')simulateScan();else if(a==='next'){state.concept=(state.concept+1)%10;state.tab='Live';renderStudio()}else if(a==='record'){state.recording=!state.recording;toast(state.recording?'● DEMO recording started':'DEMO recording stopped')}else if(a==='ptz')toast('PTZ demo: button command preview only');else if(a==='light')toast('Lighting demo: no command sent');else if(a==='tabEvents'){state.tab='Events';renderStudio()}else if(a==='settings'){state.tab='Settings';renderStudio()}else if(a==='add'){toast('Add camera dialog (native build stage)')}else toast('UI prototype • not connected to CCTV')})}
let renderStop=null;
async function initThreeIfNeeded(){if(renderStop){renderStop();renderStop=null}if(state.concept!==9||state.tab!=='Live')return;let canvas=document.querySelector('.hardware .three-stage');if(!canvas)return;
 try{let THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');if(!canvas.isConnected)return;
 const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(45,1,0.1,100);camera.position.z=3.5;
 const geo=new THREE.IcosahedronGeometry(1.1,1);const mat=new THREE.MeshStandardMaterial({color:0xd82d49,metalness:.48,roughness:.35,wireframe:false,flatShading:true});const obj=new THREE.Mesh(geo,mat);scene.add(obj);let wire=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xff9aab,transparent:true,opacity:.67}));obj.add(wire);scene.add(new THREE.AmbientLight(0xffffff,1.5));let lamp=new THREE.PointLight(0xff254c,25);lamp.position.set(2,2,3);scene.add(lamp);
 const resize=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}};resize();
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;renderer.setAnimationLoop((time)=>{if(document.hidden||!canvas.isConnected)return;if(!reduce){obj.rotation.y=time*.00021;obj.rotation.x=Math.sin(time*.00028)*.22}renderer.render(scene,camera)});let ro=new ResizeObserver(resize);ro.observe(canvas);renderStop=()=>{ro.disconnect();renderer.setAnimationLoop(null);geo.dispose();wire.geometry.dispose();wire.material.dispose();mat.dispose();renderer.dispose()};
 }catch(e){canvas.style.display='none'}
}
window.addEventListener('keydown',e=>{if(new URLSearchParams(location.search).has('contact'))return;if(e.key==='ArrowRight'){state.concept=(state.concept+1)%10;state.tab='Live';renderStudio()}if(e.key==='ArrowLeft'){state.concept=(state.concept+9)%10;state.tab='Live';renderStudio()}if(e.key.toLowerCase()==='t'){state.theme=state.theme==='dark'?'light':'dark';renderStudio()}});
window.addEventListener('resize',()=>{if(new URLSearchParams(location.search).has('contact'))sizeContacts()});
if(new URLSearchParams(location.search).has('contact'))renderContact();else renderStudio();
</script>
