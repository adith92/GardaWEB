name: GARDA shared clients source checks (no package build)
on:
  pull_request:
    paths: ['src/**', 'desktop/**', 'package*.json', 'vite.config.ts', '.github/workflows/garda-unified-checks.yml']
  push:
    branches: ['feat/garda-five-platform-mvp-20261116']
    paths: ['src/**', 'desktop/**', 'package*.json', 'vite.config.ts', '.github/workflows/garda-unified-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc --noEmit
      - run: node --test tests/demo.test.mjs desktop/policy.test.cjs
