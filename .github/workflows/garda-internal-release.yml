name: GARDA internal release · five platforms
on:
  push:
    tags: ['v*-internal.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internal-release-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r projects/garda/ai-core/requirements-unified.txt pytest
      - run: python -m pytest projects/garda/ai-core/tests -q
        env: {PYTHONPATH: projects/garda/ai-core}
  prepare:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require private repository and release tag
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$PRIVATE" = true
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9.]+-internal\.[0-9]+$ ]]
      - name: Create private draft prerelease
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "GARDA 0.13.0 — Internal five-platform MVP" --notes-file docs/RELEASE_v0.13.0_INTERNAL.md
  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test && npm run build
      - run: python3 scripts/verify-client-export.py
      - name: Upload verified Web bundle
        run: |
          cd dist
          zip -qr ../GARDA-Web-0.13.0.zip .
          cd ..
          sha256sum GARDA-Web-0.13.0.zip > verification-web.txt
          gh release upload "$GITHUB_REF_NAME" GARDA-Web-0.13.0.zip verification-web.txt --clobber
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: package:windows
            name: windows
          - os: macos-26
            task: package:mac
            name: macos
          - os: ubuntu-latest
            task: package:linux
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run: {working-directory: desktop}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - run: npm test
      - name: Package Windows with persistent internal certificate
        if: matrix.name == 'windows'
        run: npm run package:windows
        env:
          CSC_LINK: ${{ secrets.GARDA_WINDOWS_PFX_B64 }}
          CSC_KEY_PASSWORD: ${{ secrets.GARDA_WINDOWS_PFX_PASSWORD }}
      - name: Package macOS ad hoc and Linux
        if: matrix.name != 'windows'
        run: npm run ${{ matrix.task }}
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
      - name: Verify Windows installer signature and upload
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $file = Get-ChildItem release/*.exe | Select-Object -First 1
          if (!$file) { throw 'EXE missing' }
          $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
          if (!$sig.SignerCertificate -or $sig.Status -eq 'HashMismatch' -or $sig.Status -eq 'NotSigned') { throw 'Invalid Authenticode signature' }
          $sha = $sig.SignerCertificate.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256).ToLower()
          if ($sha -ne '9bea20396a3ab4d749f3335c4e852ae56473a52c37b07634ece8bba623b51019') { throw 'Unexpected signing identity' }
          $sig | Format-List Status,StatusMessage,SignerCertificate | Out-File verification-windows.txt
          [IO.File]::WriteAllBytes('GARDA-Windows-Internal.cer', $sig.SignerCertificate.RawData)
          Copy-Item -LiteralPath $file.FullName -Destination GARDA-Windows-x64-0.13.0.exe
          Get-FileHash GARDA-Windows-x64-0.13.0.exe -Algorithm SHA256 | Out-File verification-windows.txt -Append
          gh release upload $env:GITHUB_REF_NAME GARDA-Windows-x64-0.13.0.exe GARDA-Windows-Internal.cer verification-windows.txt --clobber
      - name: Verify Apple Silicon app, ad hoc signature and disk image
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          APP="$(find release -maxdepth 2 -name '*.app' -type d | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee verification-macos.txt
          codesign -d --verbose=4 "$APP" 2>&1 | tee -a verification-macos.txt
          file "$APP/Contents/MacOS/GARDA Workspace" | tee -a verification-macos.txt
          file "$APP/Contents/MacOS/GARDA Workspace" | grep arm64
          cp release/*.dmg GARDA-macOS-arm64-0.13.0.dmg
          hdiutil verify GARDA-macOS-arm64-0.13.0.dmg | tee -a verification-macos.txt
          shasum -a 256 GARDA-macOS-arm64-0.13.0.dmg >> verification-macos.txt
          gh release upload "$GITHUB_REF_NAME" GARDA-macOS-arm64-0.13.0.dmg verification-macos.txt --clobber
      - name: Verify Ubuntu metadata, AppImage architecture and startup
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          cp release/*.deb GARDA-Ubuntu-x64-0.13.0.deb
          cp release/*.AppImage GARDA-Linux-x64-0.13.0.AppImage
          dpkg-deb --info GARDA-Ubuntu-x64-0.13.0.deb | tee verification-linux.txt
          test "$(dpkg-deb -f GARDA-Ubuntu-x64-0.13.0.deb Architecture)" = amd64
          file release/linux-unpacked/garda-workspace-desktop | tee -a verification-linux.txt
          set +e
          timeout 15s xvfb-run -a release/linux-unpacked/garda-workspace-desktop --no-sandbox > smoke-linux.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" = 124
          cat smoke-linux.txt >> verification-linux.txt
          sha256sum GARDA-*.deb GARDA-*.AppImage >> verification-linux.txt
          gh release upload "$GITHUB_REF_NAME" GARDA-Ubuntu-x64-0.13.0.deb GARDA-Linux-x64-0.13.0.AppImage verification-linux.txt --clobber
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run: {working-directory: projects/foldview-cctv/android}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          yes | "$SDKMANAGER" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' || test -d "$ANDROID_HOME/platforms/android-37.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Restore persistent internal keystore
        env: {KEYSTORE_B64: '${{ secrets.GARDA_ANDROID_KEYSTORE_B64 }}'}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/garda-internal.p12"
      - name: Test and assemble both release editions
        run: gradle --no-daemon :app:testFoldDebugUnitTest :app:testStandardDebugUnitTest :app:assembleFoldRelease :app:assembleStandardRelease
        env:
          GARDA_ANDROID_KEYSTORE: ${{ runner.temp }}/garda-internal.p12
          GARDA_ANDROID_STORE_PASSWORD: ${{ secrets.GARDA_ANDROID_STORE_PASSWORD }}
          GARDA_ANDROID_KEY_PASSWORD: ${{ secrets.GARDA_ANDROID_STORE_PASSWORD }}
      - name: Verify packages, SDK, persistent signing certificate and exports
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/fold/release/app-fold-release.apk GARDA-FOLD-0.13.0.apk
          cp app/build/outputs/apk/standard/release/app-standard-release.apk GARDA-Standard-0.13.0.apk
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for APK in GARDA-*.apk; do
            "$AAPT" dump badging "$APK" | tee "$APK.metadata.txt"
            grep -q "versionCode='17'" "$APK.metadata.txt"
            grep -q "sdkVersion:'33'" "$APK.metadata.txt"
            "$SIGNER" verify --verbose --print-certs "$APK" | tee "$APK.signing.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$APK.signing.txt"
            grep -q 'b1e4d938be31d5910bc6127946465f1e89dacb9af8c77d5690fb046f810f3950' "$APK.signing.txt"
            ! unzip -Z1 "$APK" | grep -Ei 'garda_ai|ai-core|\.onnx$|\.p12$|\.pfx$|\.keystore$|\.jks$|face.key|camera.key'
          done
          grep -q "package: name='org.foldview.cctv'" GARDA-FOLD-0.13.0.apk.metadata.txt
          grep -q "package: name='org.garda.cctv.standard'" GARDA-Standard-0.13.0.apk.metadata.txt
          cat GARDA-*.txt > verification-android.txt
          sha256sum GARDA-*.apk >> verification-android.txt
          gh release upload "$GITHUB_REF_NAME" GARDA-FOLD-0.13.0.apk GARDA-Standard-0.13.0.apk verification-android.txt --clobber
  publish:
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-download and verify complete release inventory
        run: |
          mkdir release-check
          gh release download "$GITHUB_REF_NAME" --dir release-check
          python3 scripts/release-assets.py release-check | tee release-verification.json
          gh release upload "$GITHUB_REF_NAME" release-check/SHA256SUMS.txt release-check/updates.json release-verification.json --clobber
      - name: Publish internal prerelease in private repository
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --notes-file docs/RELEASE_v0.13.0_INTERNAL.md
