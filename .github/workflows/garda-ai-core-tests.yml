name: GARDA AI unified source - Windows + Linux CI and audit archive

on:
  push:
    paths:
      - 'projects/garda/**'
      - 'projects/foldview-cctv/android/**'
      - '.github/workflows/garda-ai-core-tests.yml'
  pull_request:
    paths:
      - 'projects/garda/**'
      - 'projects/foldview-cctv/android/**'
      - '.github/workflows/garda-ai-core-tests.yml'
  workflow_dispatch:
    inputs:
      package_source:
        description: 'Create optional internal source audit archive'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cross-platform-unit:
    name: Python 3.11 checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/garda/ai-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "fastapi>=0.122,<1" "httpx>=0.27,<1" "cryptography>=43,<49"
          python -m pip install "python-multipart>=0.0.20,<1" "Pillow>=11,<14"
      - name: Python syntax check for all GARDA Python modules
        run: |
          python -m compileall -q garda_ai ../desktop
          python -m compileall -q tests
      - name: Cross-platform source tests (synthetic, no real biometric data)
        run: python -m unittest discover -s tests -v
      - name: Model and camera caveat
        run: |
          echo "CI DOES NOT prove real-camera PTZ/zoom movement or face/plate OCR accuracy."
          echo "No RTSP credentials, models or original footage are downloaded in this test."

  package-source:
    if: github.event_name == 'workflow_dispatch' && inputs.package_source
    name: Package full source for audited handoff
    needs: cross-platform-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked GARDA source (no .env/private data)
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/GARDA-UNIFIED-SOURCE-v0.2.0-Windows-Linux-Android.zip HEAD \
            projects/garda/ai-core \
            projects/garda/desktop \
            projects/garda/mobile/android \
            projects/foldview-cctv/android \
            projects/cctv-firmware/fh8852v201-onvif \
            .github/workflows/garda-ai-core-tests.yml \
            .github/workflows/foldview-build.yml
          sha256sum dist/GARDA-UNIFIED-SOURCE-v0.2.0-Windows-Linux-Android.zip > dist/SHA256SUMS.txt
          unzip -t dist/GARDA-UNIFIED-SOURCE-v0.2.0-Windows-Linux-Android.zip | tail -n 1
          test -s dist/GARDA-UNIFIED-SOURCE-v0.2.0-Windows-Linux-Android.zip
      - name: Upload verified source distribution
        uses: actions/upload-artifact@v4
        with:
          name: GARDA-UNIFIED-SOURCE-v0.2.0-Windows-Linux-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error
